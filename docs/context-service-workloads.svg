<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="510" viewBox="0 0 1240 510" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Moca workloads with Context Service</title>
  <desc id="desc">A client creates a workload in Moca, which creates its Context in Context Service and returns a one-time upload grant. The client may upload a context bundle directly to Context Service, then activates the workload so Moca freezes that revision. Runs on a workload arrive in a later change. Deleting the workload deletes its Context.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-later" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub { font-size: 12px; fill: #6b7280; }
    .api { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #111827; }
    .line { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .step circle { fill: #1f2937; }
    .step text { font-size: 11.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
  </style>

  <rect width="1240" height="510" rx="12" fill="#ffffff"/>

  <!-- Client -->
  <rect class="box" x="20" y="40" width="220" height="360" rx="10" fill="#eef4ff" stroke="#4a6fa5"/>
  <text class="title" x="130" y="212" text-anchor="middle">Client</text>
  <text class="sub" x="130" y="232" text-anchor="middle">local agent, script, or CI</text>

  <!-- Moca -->
  <rect class="box" x="500" y="40" width="220" height="360" rx="10" fill="#fff4e5" stroke="#d08c2c"/>
  <text class="title" x="610" y="212" text-anchor="middle">Moca</text>
  <text class="sub" x="610" y="232" text-anchor="middle">owner-bound workload records</text>

  <!-- Context Service -->
  <rect class="box" x="1000" y="40" width="220" height="360" rx="10" fill="#eaf7ee" stroke="#3c8d5a"/>
  <text class="title" x="1110" y="150" text-anchor="middle">Context Service</text>
  <text class="sub" x="1110" y="170" text-anchor="middle">stores and freezes context</text>
  <path class="box" d="M1030,235 v50 a80,11 0 0,0 160,0 v-50" fill="#f4fbf6" stroke="#3c8d5a"/>
  <ellipse class="box" cx="1110" cy="235" rx="80" ry="11" fill="#f4fbf6" stroke="#3c8d5a"/>
  <text class="title" x="1110" y="268" text-anchor="middle" style="font-size: 14px;">Context PVC</text>
  <text class="sub" x="1110" y="286" text-anchor="middle">revisions</text>

  <!-- 1 create -->
  <line class="line" x1="240" y1="90" x2="498" y2="90"/>
  <g class="step"><circle cx="262" cy="90" r="10"/><text x="262" y="90">1</text></g>
  <text class="api" x="280" y="84">POST /workloads</text>
  <text class="sub" x="280" y="106">returns a one-time upload grant</text>

  <line class="line" x1="720" y1="90" x2="998" y2="90"/>
  <g class="step"><circle cx="742" cy="90" r="10"/><text x="742" y="90">1</text></g>
  <text class="api" x="760" y="71">POST /internal/v1/contexts</text>
  <text class="api" x="760" y="84">POST {ctx}/upload-capabilities</text>
  <text class="sub" x="760" y="106">create Context, issue grant</text>

  <!-- 3 activate -->
  <line class="line" x1="240" y1="190" x2="498" y2="190"/>
  <g class="step"><circle cx="262" cy="190" r="10"/><text x="262" y="190">3</text></g>
  <text class="api" x="280" y="184">POST /workloads/{id}/activate</text>
  <text class="sub" x="280" y="206">use the uploaded revision</text>

  <line class="line" x1="720" y1="190" x2="998" y2="190"/>
  <g class="step"><circle cx="742" cy="190" r="10"/><text x="742" y="190">3</text></g>
  <text class="api" x="760" y="184">POST /internal{ctx}/freeze</text>
  <text class="sub" x="760" y="206">pin that exact revision</text>

  <!-- 4 run (later) -->
  <line x1="240" y1="270" x2="498" y2="270" style="stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-later);"/>
  <g class="step"><circle cx="262" cy="270" r="10" style="fill: #9ca3af;"/><text x="262" y="270">4</text></g>
  <text class="api" x="280" y="264" style="fill: #6b7280;">POST /runs {workloadId}</text>
  <text class="sub" x="280" y="286">next change: run with this context</text>

  <!-- 5 delete -->
  <line class="line" x1="240" y1="350" x2="498" y2="350"/>
  <g class="step"><circle cx="262" cy="350" r="10"/><text x="262" y="350">5</text></g>
  <text class="api" x="280" y="344">DELETE /workloads/{id}</text>
  <text class="sub" x="280" y="366">remove the workload</text>

  <line class="line" x1="720" y1="350" x2="998" y2="350"/>
  <g class="step"><circle cx="742" cy="350" r="10"/><text x="742" y="350">5</text></g>
  <text class="api" x="760" y="344">DELETE /internal{ctx}</text>
  <text class="sub" x="760" y="366">delete the Context</text>

  <!-- 2 upload, directly to Context Service -->
  <path class="line" d="M130,400 V445 H1110 V402"/>
  <g class="step"><circle cx="300" cy="445" r="10"/><text x="300" y="445">2</text></g>
  <text class="api" x="318" y="439">PUT /v1/uploads/{id}</text>
  <text class="sub" x="318" y="461">bundle + one-time token, straight to Context Service, when the client brings local context</text>

  <text class="api" x="20" y="495" style="fill: #6b7280; font-size: 11px;">{ctx} = /v1/namespaces/{ns}/contexts/{name}</text>
</svg>
