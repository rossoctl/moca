# Dev-machine TRIAL deployment of the P6 process-manager runtime (#342): supervisor + relay +
# redis, plus one sandbox so a turn has somewhere to run. The production path is deploy/vm/
# (systemd + podman); see README.md here for which to use when.
#
# Inputs come from .env next to this file (install.sh writes one): SH_RELAY_TOKEN and
# SH_TURNS_PER_WORKER are required, everything else is optional. Every service's environment
# mirrors deploy/vm/env/*.env.example var-for-var; only the addressing differs, because the peers
# here are compose service names, not 127.0.0.1. deploy/compose/tests/compose.test.sh holds both
# of those to account.
#
# The MU1 control plane (#348) -- login, sessions, credentials, session tokens; what mocactl talks
# to -- is the `control-plane` PROFILE, because it cannot start without a GitHub OAuth client id
# (SH_GITHUB_CLIENT_ID) and a stack without one must still come up. install.sh sets
# COMPOSE_PROFILES=control-plane in .env when it is given a client id.
name: serverless-harness

services:
  # docker.io/redis:7-alpine, as deploy/vm/setup-vm.sh's start_redis pins. Unpublished: this Redis
  # has no auth and holds sh:sandbox:records, so whoever can write to it chooses the executor for
  # every turn. Only moca-brain reaches it -- no sandbox shares a network with it (MI1 §5 R8). No
  # volume, same as the VM path: a trial starts from an empty Redis.
  redis:
    image: docker.io/redis:7-alpine
    networks: [moca-brain]
    restart: unless-stopped

  sandbox-relay:
    image: ${SH_HARNESS_IMAGE:-ghcr.io/rossoctl/moca:latest}
    # `node --import tsx` resolves the tsx loader from the CWD, and tsx is linked only into each
    # package's own node_modules -- so the package dir, never the repo root (setup-vm.test.sh).
    working_dir: /app/packages/sandbox-relay
    command: [node, --import, tsx, src/main.ts]
    user: '1000:1000'
    environment:
      # This value feeds the relay's attach bind AND the sandbox's dial address below;
      # MOCA_RELAY_EXEC_PORT does the same for the exec side. So the relay.env.example footgun
      # (bind and dial ports read from different files) cannot recur on either wire.
      SH_RELAY_PORT: ${SH_RELAY_PORT:-9443}
      REDIS_URL: redis://redis:6379
      # P6.3 sandbox affinity: detach mark TTL. See deploy/vm/env/relay.env.example.
      SH_SANDBOX_AFFINITY_TTL_SECONDS:
      # Fail-closed at the relay (makeDefaultValidateToken): no token, no attach. Fail here first.
      SH_RELAY_TOKEN: ${SH_RELAY_TOKEN:?SH_RELAY_TOKEN is required -- set it in .env (install.sh generates one)}
      # The workers' credential for SandboxExec (MI1 §5 R5). Never set on the sandbox service.
      MOCA_RELAY_EXEC_TOKEN: ${MOCA_RELAY_EXEC_TOKEN:?MOCA_RELAY_EXEC_TOKEN is required -- set it in .env (install.sh generates one)}
      # SandboxExec on its own listener, bound to the brain-side address only: the exec port is not
      # listening on moca-sandbox at all (MI1 §5 R5/R8). The supervisor's SH_RELAY_ADDR dials it.
      MOCA_RELAY_EXEC_ADDR: ${MOCA_RELAY_BRAIN_IP:-172.31.250.10}:${MOCA_RELAY_EXEC_PORT:-9444}
    networks:
      moca-brain:
        ipv4_address: ${MOCA_RELAY_BRAIN_IP:-172.31.250.10}
      moca-sandbox: {}
    depends_on: [redis]
    restart: unless-stopped

  # The supervisor forks its whole worker pool (SH_WORKERS processes) with child_process.fork(),
  # which cannot create a process in another container. So this ONE service holds supervisor and
  # workers together: scale W with SH_WORKERS, never with replicas or per-worker services. For
  # more capacity than one container's CPUs, run another copy of this whole stack.
  supervisor:
    image: ${SH_HARNESS_IMAGE:-ghcr.io/rossoctl/moca:latest}
    working_dir: /app/packages/supervisor
    command: [node, --import, tsx, src/main.ts]
    user: '1000:1000'
    environment:
      PORT: '8080'
      # Unset unless .env sets it: the default, os.availableParallelism(), honours this
      # container's CPU limit (#341).
      SH_WORKERS:
      SH_TURNS_PER_WORKER: ${SH_TURNS_PER_WORKER:?SH_TURNS_PER_WORKER is required -- set it in .env}
      SH_ROUTING_POLICY: leastInFlight
      SH_WORKER_RESTART_BACKOFF_MS: '250'
      SH_SANDBOX_DISCOVERY: records
      SH_REMOTE_SANDBOX: '1'
      # P6.3 sandbox tiers: unset = untiered (this trial runs one tier). See deploy/vm/env/supervisor.env.example.
      SH_SANDBOX_TIERS:
      SH_SANDBOX_DEFAULT_TIER:
      SH_SANDBOX_AFFINITY_GRACE_SECONDS:
      SH_SANDBOX_AFFINITY_TTL_SECONDS:
      # Detachable turns (turn-reattach spec §5.6): a mocactl turn survives its client quitting.
      SH_TURN_DETACH: ${SH_TURN_DETACH:-1}
      SH_TURN_DETACHED_MAX_S: ''
      SH_TURN_LOG_TTL_S: ''
      SH_RELAY_ADDR: sandbox-relay:${MOCA_RELAY_EXEC_PORT:-9444}
      MOCA_RELAY_EXEC_TOKEN: ${MOCA_RELAY_EXEC_TOKEN:?MOCA_RELAY_EXEC_TOKEN is required -- set it in .env (install.sh generates one)}
      REDIS_URL: redis://redis:6379
      KAGENTI_SANDBOX_POOL_SELECTOR: app=sandbox
      KAGENTI_SANDBOX_CAP: '4'
      # The worker's session scratch space; the image's /app is not writable by uid 1000.
      HOME: /tmp
      # Model settings, passed only when .env sets them. A blank value is not "unset" to the
      # worker: run-turn.ts's `env.SH_MODEL ?? default` keeps an empty string.
      ANTHROPIC_API_KEY:
      ANTHROPIC_AUTH_TOKEN:
      ANTHROPIC_BASE_URL:
      OPENAI_API_KEY:
      OPENAI_BASE_URL:
      SH_MODEL:
      SH_MODEL_PROVIDER:
      SH_MODEL_API:
      SH_MODEL_BASE_URL:
      SH_MODEL_AUTH:
      SH_MODEL_CUSTOM:
      # MU1 caller authentication (#348). The supervisor verifies session tokens locally against the
      # control plane's PUBLIC keys and swaps them for the caller's credential over the exchange hop.
      # A present-but-invalid token is refused even with SH_REQUIRE_AUTH=false (turn-auth.ts), so
      # these must match the control plane's, which install.sh guarantees by generating both halves
      # together (only once the control plane is enabled). The keyset and exchange token pass
      # through only when .env sets them; SH_CONTROL_PLANE_URL is always the service address.
      # Without the control-plane profile all of it is inert: nothing can mint a token.
      SH_SESSION_TOKEN_PUBLIC_KEYS:
      SH_CONTROL_PLANE_URL: http://control-plane:8080
      SH_EXCHANGE_TOKEN:
      # `false` keeps plain `curl /turn` working for a trial; `true` makes every turn need a token.
      SH_REQUIRE_AUTH: ${SH_REQUIRE_AUTH:-false}
    ports:
      # Loopback only. The admin /metrics listener (SH_ADMIN_PORT, 8081) is unauthenticated and
      # stays unpublished; reach it with `docker compose exec supervisor`.
      - 127.0.0.1:${SH_PORT:-8080}:8080
    networks: [moca-brain]
    depends_on: [redis, sandbox-relay]
    restart: unless-stopped

  # The MU1 control plane: what `mocactl --control-plane-url http://127.0.0.1:8090` talks to. It is
  # the only service holding the signing key and the credential KEK; the supervisor gets public
  # halves and the exchange token only. Credentials are the file store on a named volume, so they
  # survive `docker compose down` (though not `down -v`); for a VM deployment use Vault instead
  # (SH_CREDENTIAL_STORE=vault, packages/control-plane/src/vault-store.ts).
  #
  # Its secrets are NOT `:?`-required here: Compose interpolates `:?` for every service, profile
  # active or not, so a required one would stop the stack from starting without this profile. The
  # control plane itself refuses to boot on any missing one, naming it (`docker compose logs
  # control-plane`).
  control-plane:
    image: ${SH_HARNESS_IMAGE:-ghcr.io/rossoctl/moca:latest}
    profiles: [control-plane]
    working_dir: /app/packages/control-plane
    command: [node, --import, tsx, src/main.ts]
    user: '1000:1000'
    environment:
      SH_CONTROL_PLANE_PORT: '8080'
      REDIS_URL: redis://redis:6379
      SH_CREDENTIAL_STORE: file
      SH_CREDENTIAL_DIR: /var/lib/moca/credentials
      SH_SESSION_TOKEN_PRIVATE_KEY:
      SH_CREDENTIAL_KEK:
      SH_EXCHANGE_TOKEN:
      SH_GITHUB_CLIENT_ID:
      SH_ADMIN_SUBJECTS:
      # P6.3 sandbox tiers. See deploy/vm/env/control-plane.env.example.
      SH_SANDBOX_TIERS:
      SH_SANDBOX_DEFAULT_TIER:
      # The harness as the USER reaches it, advertised by GET /v1/discovery, so mocactl needs only
      # this service's URL. Tracks SH_PORT, the supervisor's published port.
      SH_PUBLIC_HARNESS_URL: http://127.0.0.1:${SH_PORT:-8080}
      # Operator-key fallback: OFF unless .env sets SH_ALLOW_OPERATOR_FALLBACK=true, and when on,
      # every user without their own inference credential spends the operator's key (spec §6.4).
      SH_ALLOW_OPERATOR_FALLBACK:
      SH_OPERATOR_INFERENCE_TOKEN:
      # authorization (Bearer, a gateway token; the default) or x-api-key (an Anthropic API key, with
      # SH_DEFAULT_INFERENCE_ENDPOINT=https://api.anthropic.com). The control plane refuses to boot
      # on a token, header and endpoint that cannot work together (#368).
      SH_OPERATOR_INFERENCE_HEADER:
      SH_DEFAULT_INFERENCE_ENDPOINT:
      SH_API_TOKEN_TTL_SECONDS:
      SH_SESSION_TOKEN_TTL_SECONDS:
      SH_REFRESH_IDLE_TTL_SECONDS:
      SH_REFRESH_MAX_TTL_SECONDS:
      SH_REFRESH_REUSE_GRACE_SECONDS:
    volumes:
      - moca-credentials:/var/lib/moca/credentials
    ports:
      # Loopback only, like the supervisor.
      - 127.0.0.1:${SH_CP_PORT:-8090}:8080
    networks: [moca-brain]
    depends_on: [redis]
    restart: unless-stopped

  # One remote-worker sandbox dialing out to the relay, like each of setup-vm.sh's sh-sandbox-N.
  # For more, copy this service with a different SANDBOX_ID: replicas would share one id and
  # collide on a single sh:sandbox:records entry.
  sandbox:
    image: ${SH_SANDBOX_IMAGE:-ghcr.io/rossoctl/moca-remote-worker:latest}
    environment:
      SANDBOX_ID: sh-sandbox-0
      RELAY_ADDR: sandbox-relay:${SH_RELAY_PORT:-9443}
      SANDBOX_TOKEN: ${SH_RELAY_TOKEN:?SH_RELAY_TOKEN is required -- set it in .env (install.sh generates one)}
    networks: [moca-sandbox]
    depends_on: [sandbox-relay]
    restart: unless-stopped

volumes:
  # The control plane's credential store. Envelope-encrypted under SH_CREDENTIAL_KEK, so a copy of
  # the volume without .env yields ciphertext.
  moca-credentials: {}

networks:
  # The brain side: supervisor + workers, Redis, the relay's SandboxExec listener and the control
  # plane. Sandboxes are never attached here (MI1 §5 R8). A fixed subnet so the relay's exec
  # listener can bind this side's address alone.
  moca-brain:
    ipam:
      config:
        - subnet: ${MOCA_BRAIN_SUBNET:-172.31.250.0/24}
  # The hands side: sandboxes and the relay's Attach listener. Still routed to the internet in S1;
  # MI1 S5 makes it `internal: true` once moca-egress exists to route through.
  moca-sandbox: {}
