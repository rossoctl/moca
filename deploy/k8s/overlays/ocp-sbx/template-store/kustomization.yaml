# The template store for the SBX0 control plane (template lifecycle spec §3.1, §7.2): the catalog,
# the policy and the provenance records on a volume (SH_PROVENANCE_DIR), and the template host
# agents' bearers (SH_TEMPLATE_HOSTS, SH_HOST_TOKEN_<ID>). A Component, not part of the overlay:
# deploy/sbx/setup.sh lists it only behind SBX_TEMPLATE_STORE=1, so a stack without the switch
# renders exactly as before.
#   pvc.yaml                    the store's volume, 1 GiB RWO
#   patch-control-plane.yaml    Recreate (an RWO volume cannot attach to a surge pod), the store env,
#                               the PVC mount, and sbx-template-hosts (the host tokens) as one more
#                               projected source of the /run/credentials volume
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - pvc.yaml
patches:
  - path: patch-control-plane.yaml
