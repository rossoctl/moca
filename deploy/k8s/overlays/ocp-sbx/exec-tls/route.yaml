# The host is a placeholder: deploy/sbx/setup.sh's generated overlay sets SBX_EXEC_HOST, the host the
# exec certificate is issued for. Passthrough, so HTTP/2 and trailers survive end to end. The router
# timeout stays well above the relay's 20 s keepalive (SBX0 §3.4), which is what keeps a silent Exec's
# connection from ever looking idle.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: sbx-exec
  namespace: moca
  annotations:
    haproxy.router.openshift.io/timeout: 5m
spec:
  host: sbx-exec.apps.example.invalid
  to:
    kind: Service
    name: sbx-relay-exec-tls
  port:
    targetPort: https-exec
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: None
