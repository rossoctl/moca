apiVersion: apps/v1
kind: Deployment
metadata: { name: moca-supervisor, namespace: moca }
spec:
  template:
    spec:
      containers:
        # A byte-for-byte TCP proxy: TLS ends here, and every client connection becomes exactly one
        # connection to 127.0.0.1:8080, so the supervisor's per-connection hand-off, routing and
        # admission see what they would see with no proxy at all. NOT an HTTP proxy: never replace
        # it with one.
        - name: tls
          image: ghostunnel
          args:
            - server
            - --listen
            - 0.0.0.0:8443
            - --target
            - 127.0.0.1:8080
            - --cert
            - /tls/tls.crt
            - --key
            - /tls/tls.key
            - --disable-authentication
            # The readiness probe's own port (#724): /_metrics answers while ghostunnel runs and dials
            # nothing, where a tcpSocket probe of the TLS port logged a handshake error every 5 s and
            # /_status would open a connection to the target on every probe. Default-deny ingress
            # keeps it off the pod network; the kubelet's probes reach it as they reach the TLS port.
            - --status
            - http://0.0.0.0:8453
          ports:
            - { name: https, containerPort: 8443 }
            - { name: status, containerPort: 8453 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /_metrics, port: status }
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: tls
          secret:
            secretName: moca-supervisor-tls
            defaultMode: 288 # 0440
