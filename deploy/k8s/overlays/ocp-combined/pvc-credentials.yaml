# The harness's file credential store (combined control plane design §3.6). With SH_CREDENTIAL_STORE=file
# the control plane needs no Kubernetes API access: no Role over the namespace's Secrets (which, in one
# namespace, would reach moca-relay's exec token and the TLS keys), no service account token.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: moca-credentials, namespace: moca }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
