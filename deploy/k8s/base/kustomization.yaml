# P6 on Kubernetes (spec docs/specs/2026-10-02-p6-on-kubernetes-slice1-design.md). Shares nothing
# with deploy/knative/: that is the Knative path RA1 deprecates; this is the P6 process model on a
# cluster (ADR-0037).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - network-policy-defaults.yaml
  - redis.yaml
  - relay.yaml
  - supervisor.yaml
  - control-plane.yaml
  - sandbox.yaml
images:
  - name: moca-harness
    newName: ghcr.io/rossoctl/moca
    newTag: latest
  - name: moca-remote-worker
    newName: ghcr.io/rossoctl/moca-remote-worker
    newTag: latest
  # Valkey holds sh:sandbox:records and every session, so it runs a digest, not a moving tag. The
  # tag stays deploy/vm/setup-vm.sh's (the version's source of truth); the digest is that tag's
  # multi-arch index, resolved when the pin was last moved. To move it: resolve the tag's current
  # digest (`docker buildx imagetools inspect docker.io/valkey/valkey:9-alpine`) and replace it here.
  - name: docker.io/valkey/valkey
    newTag: 9-alpine
    digest: sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
