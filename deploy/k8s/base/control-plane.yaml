# The MU1 control plane (spec §3.5), adapted from deploy/knative/control-plane.yaml (copied, not
# referenced: deploy/k8s shares nothing with the deprecated path). Dropped: the pods Role, which
# only serves a pod-exec harness. Its three secrets are FILES under CREDENTIALS_DIRECTORY
# (withCredentials, src/main.ts); non-secret settings come from ConfigMap moca-settings, which
# setup.sh writes.
apiVersion: v1
kind: ServiceAccount
metadata: { name: moca-control-plane, namespace: moca }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: moca-control-plane-credentials, namespace: moca-credentials }
rules:
  # No list: a compromised control plane reads one credential at a time, by name.
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: moca-control-plane-credentials, namespace: moca-credentials }
subjects:
  - { kind: ServiceAccount, name: moca-control-plane, namespace: moca }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: moca-control-plane-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: moca-control-plane, namespace: moca }
spec:
  replicas: 1
  selector: { matchLabels: { app: moca-control-plane } }
  template:
    metadata: { labels: { app: moca-control-plane } }
    spec:
      serviceAccountName: moca-control-plane
      # K8sSecretStore shells out to kubectl, which uses this token.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: control-plane
          image: moca-harness
          workingDir: /app/packages/control-plane
          command: [node, --import, tsx, src/main.ts]
          env:
            - { name: HOME, value: /tmp }
            - { name: SH_CONTROL_PLANE_PORT, value: '8080' }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: moca-redis, key: REDIS_URL } }
            - { name: SH_CREDENTIAL_STORE, value: kubernetes }
            - { name: SH_CREDENTIAL_NAMESPACE, value: moca-credentials }
            - { name: SH_SANDBOX_NAMESPACE, value: moca-sandbox }
            - { name: CREDENTIALS_DIRECTORY, value: /run/credentials }
            - name: SH_GITHUB_CLIENT_ID
              valueFrom: { configMapKeyRef: { name: moca-settings, key: SH_GITHUB_CLIENT_ID } }
            - name: SH_ADMIN_SUBJECTS
              valueFrom: { configMapKeyRef: { name: moca-settings, key: SH_ADMIN_SUBJECTS } }
            # P6.3 sandbox tiers: written to moca-settings by setup.sh ONLY on a stack with both
            # tiers; optional, so a stack without them renders exactly as before (untiered).
            # Must match the supervisor's: one list validates a session, the other places its turns.
            - name: SH_SANDBOX_TIERS
              valueFrom:
                { configMapKeyRef: { name: moca-settings, key: SH_SANDBOX_TIERS, optional: true } }
            - name: SH_SANDBOX_DEFAULT_TIER
              valueFrom:
                {
                  configMapKeyRef:
                    { name: moca-settings, key: SH_SANDBOX_DEFAULT_TIER, optional: true },
                }
            - name: SH_PUBLIC_HARNESS_URL
              valueFrom: { configMapKeyRef: { name: moca-settings, key: SH_PUBLIC_HARNESS_URL } }
            # false unless setup.sh is told otherwise. true also needs SH_OPERATOR_INFERENCE_TOKEN,
            # which this slice does not wire, so the control plane would refuse to boot (#368).
            - name: SH_ALLOW_OPERATOR_FALLBACK
              valueFrom:
                { configMapKeyRef: { name: moca-settings, key: SH_ALLOW_OPERATOR_FALLBACK } }
            # Token lifetimes in seconds (#432); setup.sh writes '' when unset, which is the
            # control plane's default (900 for an API token, 300 for a session token).
            - name: SH_API_TOKEN_TTL_SECONDS
              valueFrom: { configMapKeyRef: { name: moca-settings, key: SH_API_TOKEN_TTL_SECONDS } }
            - name: SH_SESSION_TOKEN_TTL_SECONDS
              valueFrom:
                { configMapKeyRef: { name: moca-settings, key: SH_SESSION_TOKEN_TTL_SECONDS } }
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: credentials, mountPath: /run/credentials, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: credentials
          secret:
            secretName: moca-mu1
            items:
              - { key: SH_SESSION_TOKEN_PRIVATE_KEY, path: SH_SESSION_TOKEN_PRIVATE_KEY }
              - { key: SH_CREDENTIAL_KEK, path: SH_CREDENTIAL_KEK }
              - { key: SH_EXCHANGE_TOKEN, path: SH_EXCHANGE_TOKEN }
            defaultMode: 256 # 0400
---
apiVersion: v1
kind: Service
metadata: { name: moca-control-plane, namespace: moca }
spec:
  selector: { app: moca-control-plane }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: moca-control-plane, namespace: moca }
spec:
  podSelector: { matchLabels: { app: moca-control-plane } }
  policyTypes: [Ingress, Egress]
  ingress:
    # The supervisor's exchange hop. Users arrive by port-forward (Kind) or the edge Route (the
    # OCP overlay adds the router namespace).
    - from: [{ podSelector: { matchLabels: { app: moca-supervisor } } }]
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: redis } } }]
      ports: [{ protocol: TCP, port: 6379 }]
    # kube API (443 at the Service, 6443 after DNAT on most clusters) and GitHub's device flow.
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 6443 }
