# Default deny, both directions, in every namespace: the replacement for the VM's isolate=strict and
# nftables (spec §5). Each workload's own policy then allows exactly its edges.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: moca
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: moca-sandbox
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: moca-credentials
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# DNS for the pods that resolve names. Redis resolves none and gets none. The OCP overlay adds
# openshift-dns:5353 to both of these.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: moca
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - moca-supervisor
          - sandbox-relay
          - moca-control-plane
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: moca-sandbox
spec:
  podSelector:
    matchLabels:
      app: moca-sandbox
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
