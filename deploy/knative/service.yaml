apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: moca
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: '0'
        autoscaling.knative.dev/max-scale: '5'
        autoscaling.knative.dev/scale-to-zero-pod-retention-period: '30s'
        autoscaling.knative.dev/target: '1'
        autoscaling.knative.dev/target-burst-capacity: '0'
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      serviceAccountName: moca
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - image: dev.local/moca:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          ports:
            - containerPort: 8080
          env:
            - name: HOME
              value: /tmp
            - name: REDIS_URL
              value: 'redis://redis.default.svc:6379'
            - name: SH_MODEL
              value: 'claude-haiku-4-5'
            - name: KAGENTI_SANDBOX_POOL_SELECTOR
              value: 'sh.kagenti.io/sandbox-pool=default'
            # - name: KAGENTI_SANDBOX_POD      # single-pod test override (only effective when KAGENTI_SANDBOX_POOL_SELECTOR is unset; pool selector takes precedence)
            #   value: "sandbox-0-0"
            - name: LEAF_RESULT_TTL_SECONDS
              value: '86400'
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: api-key
            - name: ANTHROPIC_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: base-url
                  optional: true
            - name: ANTHROPIC_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-credentials
                  key: auth-token
                  optional: true
            # MU1: caller authentication on /turn. Default FALSE -- 14 scripts in deploy/knative call
            # /turn or /runs with no auth today, and making the token mandatory in one step would
            # break every smoke path and both demos (spec §4.3.1). Flipping this default, and
            # updating those callers, is MU2. A present-but-BAD token is 401 in either mode.
            - name: SH_REQUIRE_AUTH
              value: 'false'
            # `<kid>:<base64 DER SPKI>[,…]`. A public key is not a secret, so this is plain
            # configuration rather than a Secret mount. Accepting a LIST is what makes rotation
            # possible without a flag day: publish the new key alongside the old, roll the Service,
            # switch the control plane to signing with the new kid, then drop the old entry
            # (spec §5.2). Empty here -- see deploy/knative/control-plane.yaml for how to derive it.
            - name: SH_SESSION_TOKEN_PUBLIC_KEYS
              value: ''
            - name: SH_CONTROL_PLANE_URL
              value: 'http://sh-control-plane.default.svc:8080'
            # The shared bearer for the exchange hop, from the SAME Secret the control plane reads
            # (spec §5.3.1). optional:true so this base manifest still applies on a cluster that has
            # not created it; the exchange is fail-closed in code, so an absent value rejects every
            # call rather than opening one.
            - name: SH_EXCHANGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sh-exchange-token
                  key: SH_EXCHANGE_TOKEN
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moca
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moca-sandbox
  namespace: default
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list']
  - apiGroups: ['']
    resources: ['pods/exec']
    verbs: ['create']
  - apiGroups: ['agents.x-k8s.io']
    resources: ['sandboxes']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moca-sandbox
  namespace: default
subjects:
  - kind: ServiceAccount
    name: moca
    namespace: default
roleRef:
  kind: Role
  name: moca-sandbox
  apiGroup: rbac.authorization.k8s.io
