# deploy/knative/overlays/ocp-async/kustomization.yaml
# OpenShift overlay for the async / KEDA leaf-worker ScaledJob (issue #158).
#
# leaf-scaledjob.yaml is deliberately excluded from the base kustomization
# (deploy/knative/kustomization.yaml) so it is not applied on non-KEDA installs.
# This overlay is rendered + applied ONLY under `setup-ocp.sh --with-keda`, after
# the base data-plane overlay (which provides the `moca`
# ServiceAccount + Role/RoleBinding the worker Jobs reuse for pod list + exec)
# and after the scaledjobs.keda.sh CRD is installed.
#
# It carries the same dev.local -> ghcr image transform as overlays/ocp, so
# render_overlay_dir()'s subsequent `ghcr -> $HARNESS_IMAGE` sed rewrites the
# ScaledJob to the real published image (fixing the raw dev.local ImagePullBackOff).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../leaf-scaledjob.yaml

images:
  - name: dev.local/moca
    newName: ghcr.io/rossoctl/moca
    newTag: latest
