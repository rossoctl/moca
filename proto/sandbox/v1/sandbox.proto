syntax = "proto3";
package sandbox.v1;

// Worker (any language) dials the relay and holds ONE bidi stream.
// worker→relay carries results/liveness; relay→worker carries commands.
service SandboxWorker {
  rpc Attach(stream WorkerFrame) returns (stream ServerFrame);
}

// Harness asks the relay to run a command on a connected sandbox and
// streams the output back. The relay bridges to the worker's Attach
// stream, keyed by sandbox_id. In-cluster only.
service SandboxExec {
  rpc Exec(ExecRequest) returns (stream ExecEvent);   // server-streaming output
  rpc Abort(AbortRequest) returns (AbortResponse);

  // Lease mode (SBX0.3). Both act on the sandbox's lease, not on one Exec, and both
  // are relayed to the worker as a ServerFrame. LeaseControl reads the lease status,
  // ends the lease (reset) or changes the mode (set_mode, which needs a signed
  // set_mode_token). LeaseKeepalive records harness liveness for a live lease (the
  // keepalive-loss rule); it never resets idle, and the worker gives no answer.
  rpc LeaseControl(LeaseControlRequest) returns (LeaseControlResponse);
  rpc LeaseKeepalive(LeaseKeepaliveRequest) returns (LeaseKeepaliveResponse);
}

// ---- worker → relay ----
message WorkerFrame {
  oneof msg {
    Hello     hello     = 1;   // sent first: identity + capabilities
    Heartbeat heartbeat = 2;   // liveness; also keeps NAT/proxy state open
    Chunk     chunk     = 3;   // streamed stdout for an exec
    End       end       = 4;   // terminal success for an exec
    ExecError error     = 5;   // exec/channel failure
    LeaseEvent         lease        = 6;   // a lease state change, unsolicited
    LeaseControlResult lease_result = 7;   // the answer to a LeaseControlFrame, by ctl_id
  }
}

// ---- relay → worker ----
message ServerFrame {
  oneof msg {
    Exec  exec  = 1;           // run one command
    Abort abort = 2;           // cancel an in-flight exec
    LeaseControlFrame   lease_control = 3;   // status | reset | set_mode; answered by lease_result
    LeaseKeepaliveFrame keepalive     = 4;   // keepalive-loss heartbeat for a live lease; never resets idle; no answer
  }
}

message Hello {
  string sandbox_id            = 1;
  map<string,string> labels    = 2;   // team=alpha, env=prod, region=us-east
  repeated string capabilities = 3;   // ["python3","kubectl","gpu","node20"]
  string image                 = 4;   // sandbox image tag/digest
  string arch                  = 5;   // amd64 | arm64
  uint32 capacity_max          = 6;   // max concurrent execs the worker allows
  string trust                 = 7;   // "trusted" | "untrusted"
}

message Heartbeat {}                   // liveness/keepalive only; harness owns lease counts

message Exec {
  uint64 req_id    = 1;                // salt+counter, unique per process, probabilistically across them; correlation + dedup key
  string command   = 2;
  bytes  stdin     = 3;                // raw bytes (protobuf is binary — no base64)
  uint32 timeout_s = 4;
  bool   streaming = 5;                // true for bash/grep; false for read/write

  // workspace_key is the lease's run id (harness/src/sandbox-lease.ts keys leases by
  // leaf run id, and nothing else on the wire carries it). vmpool keys a per-run
  // host-side workspace on it; without it, consecutive leaseholders of one
  // sandbox_id would inherit the previous run's workspace — which is precisely
  // today's situation with a process-wide /workspace, and precisely the cross-tenant
  // leak the microVM tier exists to close (spec §2.3, §3.4).
  //
  // ADDITIVE. Empty means "today's single shared workspace" on the CONTAINER path,
  // which is what lets remote-worker ignore the field entirely. microvm-worker
  // REFUSES an empty value with a counted ExecError: on the VM path there is no
  // correct workspace to choose and nothing to fall back to, and an empty string
  // would blind three separate safeguards at once (spec §3.4).
  string workspace_key = 6;

  // Lease mode (SBX0.3), ADDITIVE. An Exec that sets none of these is per-exec, epoch 0,
  // which is what every client and worker built before them sends and expects. On the
  // sandbox path the relay overwrites mode, mode_epoch and idle_timeout_s from the
  // verified token claims; a client cannot pick its own. keepalive is the client's
  // opt-in. On the harness path the relay zeroes all four.
  SandboxMode mode           = 7;
  uint64      mode_epoch     = 8;    // the mode's version; the worker refuses one below the stored epoch
  uint32      idle_timeout_s = 9;    // the owner's idle timeout; 0 = the worker's default (worker-clamped)
  bool        keepalive      = 10;   // opts the lease into the keepalive-loss rule (spec §4)
}
message Abort     { uint64 req_id = 1; }

// Which output stream a Chunk carries. Default (0) is treated as stdout so a
// worker that does not set the field still collects output into stdout.
enum Stream {
  STREAM_UNSPECIFIED = 0;
  STREAM_STDOUT      = 1;   // collected into returned stdout + replayed to onData
  STREAM_STDERR      = 2;   // replayed to onData only, excluded from returned stdout
}

message Chunk     { uint64 req_id = 1; bytes data = 2; Stream stream = 3; }   // 0..n, only if streaming

// End is the terminal success frame. exit_code < 0 = signal/none.
//
// truncated says the WORKER cut this exec's STDOUT at its own buffer cap, which
// the harness cannot infer: the two caps are the same 8 MiB and the harness trips
// on strictly-greater, so exactly-cap output reads as complete (#189). exit_code
// stays the command's REAL status — a worker reports what the command did, and it
// is the harness seam that owes `truncated ⇒ exitCode == null` (spec §8). A worker
// that never sets it reads as false, which is proto3's default and the old
// behaviour; only a worker that drops stdout is obliged to set it.
//
// STDOUT ONLY, deliberately. A worker may cap stderr separately, but the seam
// returns stdout and applies its cap to stdout alone, so setting this for a cut
// stderr would discard a valid exit_code and mark whole stdout as truncated. There
// is no wire signal for a cut stderr; a worker that cares should log it.
message End       { uint64 req_id = 1; sint32 exit_code = 2; bool truncated = 3; }
message ExecError { uint64 req_id = 1; string message = 2; }

// ---- harness ↔ relay (SandboxExec) ----
message ExecRequest {
  string sandbox_id = 1;   // from the lease
  Exec   exec       = 2;

  // workload is the workload key (`w-<32 hex>`) the run names, or empty for a run on the shared
  // pool (workload sandboxes spec §3.3). ADDITIVE, and read by the relay alone: it is not part of
  // Exec, so a worker never sees it. A relay with attach public keys refuses an Exec to a sandbox
  // whose trusted moca.dev/workload label differs from it, and a non-empty value on a sandbox with
  // no such label. A relay without them ignores it. Defense in depth against routing bugs, not a
  // boundary: the worker that fills it in is still the trust root for routing.
  string workload = 3;
}
message ExecEvent   { oneof event { Chunk chunk = 1; End end = 2; ExecError error = 3; LeaseEvent lease = 4; } }
message AbortRequest  { string sandbox_id = 1; uint64 req_id = 2; }
message AbortResponse {}

// ---- lease mode (SBX0.3) ----

// A sandbox's execution mode. UNSPECIFIED (0) means per-exec: a sandbox, token or Exec
// that never names a mode runs every Exec in a fresh microVM, as before lease mode.
// The JWT and sandbox-record strings are "per-exec", "lease" and "lease+processes".
enum SandboxMode {
  SANDBOX_MODE_UNSPECIFIED     = 0;   // = per-exec
  SANDBOX_MODE_PER_EXEC        = 1;
  SANDBOX_MODE_LEASE           = 2;
  SANDBOX_MODE_LEASE_PROCESSES = 3;
}

// A lease state change. The worker sends it unsolicited (WorkerFrame.lease) and the
// relay forwards it to the client on an Exec stream (ExecEvent.lease). It is sent only
// for Execs whose mode is not per-exec, so a client that never asked for a lease never
// sees one.
message LeaseEvent {
  uint64      req_id     = 1;
  string      state      = 2;   // "start" | "end" | "expiring"
  // On "end", why it ended (spec §4.1: "idle", "reset", ...); on "expiring", "max_duration"
  // (spec §5). Empty on "start".
  string      reason     = 3;
  int64       at_unix_ms = 4;   // when it happened; also the key the event is acknowledged by
  SandboxMode mode       = 5;
  uint64      age_ms     = 6;   // the lease's age at the event
  repeated string processes = 7;   // processes that were running; filled from plan 5 on
  // On "expiring" only: the hard end, i.e. when the lease became expiring plus grace_limit
  // (unix ms). Zero on every other state.
  int64       ends_by_unix_ms = 8;
}

enum LeaseOp {
  LEASE_OP_UNSPECIFIED = 0;
  LEASE_OP_STATUS      = 1;
  LEASE_OP_RESET       = 2;
  LEASE_OP_SET_MODE    = 3;
  // Ends the lease with reason "sandbox_deleted". Takes no mode or mode_epoch.
  LEASE_OP_SANDBOX_DELETED = 4;
}

// relay → worker: one lease operation on the workspace. ctl_id correlates the
// worker's LeaseControlResult. mode and mode_epoch are read for SET_MODE only.
message LeaseControlFrame {
  uint64      ctl_id        = 1;
  string      workspace_key = 2;
  LeaseOp     op            = 3;
  SandboxMode mode          = 4;
  uint64      mode_epoch    = 5;
}

// relay → worker: harness liveness for a live lease, without an Exec (the keepalive-loss
// rule). It never resets idle. A no-op without a lease.
message LeaseKeepaliveFrame { string workspace_key = 1; }

message LeaseStatus {
  SandboxMode mode           = 1;
  bool        epoch_known    = 2;   // the worker holds a stored epoch for the workspace
  string      state          = 3;   // "none" | "active" | "expiring"
  uint64      age_ms         = 4;
  uint32      idle_timeout_s = 5;
  LeaseEvent  pending        = 6;   // the last undelivered lease event (a start or an end), kept until acknowledged
}

// worker → relay: the answer to a LeaseControlFrame. An empty error means OK; otherwise
// it is a wire string such as "stale_mode: <detail>" or "lease_unsupported: <detail>".
message LeaseControlResult {
  uint64      ctl_id = 1;
  LeaseStatus status = 2;
  string      error  = 3;
}

// ---- client ↔ relay (SandboxExec lease calls) ----
message LeaseControlRequest {
  string  sandbox_id     = 1;
  LeaseOp op             = 2;
  string  set_mode_token = 3;   // the signed set-mode token; required for SET_MODE only
}
message LeaseControlResponse   { LeaseStatus status = 1; }
message LeaseKeepaliveRequest  { string sandbox_id = 1; }
message LeaseKeepaliveResponse {}
