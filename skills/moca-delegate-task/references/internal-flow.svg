<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">MOCA task delegation with transported context</title>
  <desc id="desc">A local agent harness runs the remote_task.py helper. The helper creates a workload and receives a one-time upload grant from MOCA, uploads the context bundle directly to Context Service, activates the frozen revision, runs the task, and cleans up. MOCA creates and deletes Sandboxes that mount the frozen revision read-only.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub { font-size: 12px; fill: #6b7280; }
    .note { font-size: 12px; fill: #1f2937; }
    .api { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #111827; }
    .line { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .step circle { fill: #1f2937; }
    .step text { font-size: 11.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
  </style>

  <rect width="1040" height="610" rx="12" fill="#ffffff"/>

  <!-- Local agent harness with the helper nested inside -->
  <rect class="box" x="20" y="20" width="260" height="290" rx="10" fill="#eef4ff" stroke="#4a6fa5"/>
  <text class="title" x="40" y="48">Local agent harness</text>
  <text class="sub" x="40" y="68">reads the skill, runs the helper</text>
  <rect class="box" x="40" y="90" width="220" height="130" rx="8" fill="#ffffff" stroke="#4a6fa5"/>
  <text class="api" x="60" y="122" style="font-size: 14px; font-weight: 600;">remote_task.py</text>
  <g class="step"><circle cx="70" cy="165" r="10"/><text x="70" y="165">1</text></g>
  <text class="note" x="88" y="169">export bundle</text>
  <text class="api" x="88" y="188" style="font-size: 11px; fill: #6b7280;">contextctl ctx export</text>

  <!-- MOCA -->
  <rect class="box" x="540" y="30" width="150" height="270" rx="10" fill="#fff4e5" stroke="#d08c2c"/>
  <text class="title" x="615" y="160" text-anchor="middle">MOCA</text>
  <text class="sub" x="615" y="180" text-anchor="middle">checks ownership</text>

  <!-- Sandbox -->
  <rect class="box" x="840" y="40" width="180" height="130" rx="10" fill="#f3eefc" stroke="#7a5cc0"/>
  <text class="title" x="930" y="80" text-anchor="middle">Sandbox</text>
  <text class="sub" x="930" y="100" text-anchor="middle">remote agent</text>

  <!-- Context Service -->
  <rect class="box" x="515" y="490" width="200" height="70" rx="10" fill="#eaf7ee" stroke="#3c8d5a"/>
  <text class="title" x="615" y="522" text-anchor="middle">Context Service</text>
  <text class="sub" x="615" y="542" text-anchor="middle">stores context</text>

  <!-- PVC -->
  <path class="box" d="M840,502 v46 a90,12 0 0,0 180,0 v-46" fill="#eaf7ee" stroke="#3c8d5a"/>
  <ellipse class="box" cx="930" cy="502" rx="90" ry="12" fill="#eaf7ee" stroke="#3c8d5a"/>
  <text class="title" x="930" y="536" text-anchor="middle">PVC</text>
  <text class="sub" x="930" y="553" text-anchor="middle">context revisions</text>

  <!-- Helper -> MOCA -->
  <line class="line" x1="280" y1="70" x2="538" y2="70"/>
  <g class="step"><circle cx="300" cy="70" r="10"/><text x="300" y="70">2</text></g>
  <text class="api" x="318" y="64">POST /workloads</text>
  <text class="sub" x="318" y="86">create workload + upload grant</text>

  <line class="line" x1="280" y1="130" x2="538" y2="130"/>
  <g class="step"><circle cx="300" cy="130" r="10"/><text x="300" y="130">4</text></g>
  <text class="api" x="318" y="124">POST /workloads/{id}/activate</text>
  <text class="sub" x="318" y="146">activate the uploaded revision</text>

  <line class="line" x1="280" y1="190" x2="538" y2="190"/>
  <g class="step"><circle cx="300" cy="190" r="10"/><text x="300" y="190">5</text></g>
  <text class="api" x="318" y="184">POST /runs</text>
  <text class="sub" x="318" y="206">submit prompt</text>

  <line class="line" x1="280" y1="250" x2="538" y2="250"/>
  <g class="step"><circle cx="300" cy="250" r="10"/><text x="300" y="250">6</text></g>
  <text class="api" x="318" y="244">DELETE /workloads/{id}</text>
  <text class="sub" x="318" y="266">clean up</text>

  <!-- MOCA -> Sandbox -->
  <line class="line" x1="690" y1="66" x2="838" y2="66"/>
  <g class="step"><circle cx="710" cy="66" r="10"/><text x="710" y="66">4</text></g>
  <text class="note" x="728" y="60">create Sandboxes</text>
  <text class="sub" x="728" y="82">Kubernetes API</text>

  <line class="line" x1="690" y1="110" x2="838" y2="110"/>
  <g class="step"><circle cx="710" cy="110" r="10"/><text x="710" y="110">5</text></g>
  <text class="note" x="728" y="104">run agent</text>

  <line class="line" x1="690" y1="150" x2="838" y2="150"/>
  <g class="step"><circle cx="710" cy="150" r="10"/><text x="710" y="150">6</text></g>
  <text class="note" x="728" y="144">delete Sandboxes</text>

  <!-- MOCA -> Context Service -->
  <line class="line" x1="615" y1="300" x2="615" y2="488"/>
  <g class="step"><circle cx="615" cy="326" r="10"/><text x="615" y="326">2</text></g>
  <text class="api" x="633" y="330">POST /internal/v1/contexts</text>
  <text class="sub" x="633" y="346">create Context PVC</text>
  <g class="step"><circle cx="615" cy="366" r="10"/><text x="615" y="366">2</text></g>
  <text class="api" x="633" y="370">POST {ctx}/upload-capabilities</text>
  <text class="sub" x="633" y="386">issue one-time token</text>
  <g class="step"><circle cx="615" cy="406" r="10"/><text x="615" y="406">4</text></g>
  <text class="api" x="633" y="410">POST /internal{ctx}/freeze</text>
  <text class="sub" x="633" y="426">freeze revision, return PVC</text>
  <g class="step"><circle cx="615" cy="446" r="10"/><text x="615" y="446">6</text></g>
  <text class="api" x="633" y="450">DELETE /internal{ctx}</text>
  <text class="sub" x="633" y="466">delete Context</text>

  <!-- Helper -> Context Service (direct upload) -->
  <path class="line" d="M110,220 V525 H513"/>
  <g class="step"><circle cx="140" cy="525" r="10"/><text x="140" y="525">3</text></g>
  <text class="api" x="158" y="519">PUT /v1/uploads/{id}</text>
  <text class="sub" x="158" y="541">bundle + one-time token</text>

  <!-- Context Service -> PVC -->
  <line class="line" x1="715" y1="525" x2="838" y2="525"/>
  <g class="step"><circle cx="737" cy="525" r="10"/><text x="737" y="525">3</text></g>
  <text class="note" x="755" y="519">expand</text>

  <!-- Sandbox mounts the frozen revision -->
  <line class="line" x1="930" y1="170" x2="930" y2="488" stroke-dasharray="5 4"/>
  <g class="step"><circle cx="930" cy="190" r="10"/><text x="930" y="190">4</text></g>
  <text class="note" x="918" y="226" text-anchor="end">mounts frozen</text>
  <text class="sub" x="918" y="242" text-anchor="end">revision read-only</text>

  <text class="api" x="20" y="594" style="font-size: 11px; fill: #6b7280;">{ctx} = /v1/namespaces/{ns}/contexts/{name}</text>
</svg>
