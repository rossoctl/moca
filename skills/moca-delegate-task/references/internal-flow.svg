<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <style>
    .box { stroke-width: 1.5; }
    .title { font-size: 15px; font-weight: 600; fill: #111827; }
    .sub { font-size: 12px; fill: #6b7280; }
    .api { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #111827; }
    .line { stroke: #374151; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .step circle { fill: #1f2937; }
    .step text { font-size: 11.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
  </style>

  <rect width="1000" height="480" rx="12" fill="#ffffff"/>

  <!-- Local agent harness with the helper nested inside -->
  <rect class="box" x="20" y="20" width="240" height="230" rx="10" fill="#eef4ff" stroke="#4a6fa5"/>
  <text class="title" x="40" y="48">Local agent harness</text>
  <text class="sub" x="40" y="68">reads the skill, runs the helper</text>
  <rect class="box" x="40" y="90" width="200" height="130" rx="8" fill="#ffffff" stroke="#4a6fa5"/>
  <text class="api" x="60" y="122" style="font-size: 14px; font-weight: 600;">remote_task.py</text>
  <g class="step"><circle cx="70" cy="165" r="10"/><text x="70" y="165">1</text></g>
  <text class="sub" x="88" y="169" style="fill: #1f2937;">export bundle</text>
  <text class="api" x="88" y="188" style="font-size: 11px; fill: #6b7280;">contextctl ctx export</text>

  <!-- MOCA -->
  <rect class="box" x="520" y="40" width="140" height="220" rx="10" fill="#fff4e5" stroke="#d08c2c"/>
  <text class="title" x="590" y="144" text-anchor="middle">MOCA</text>
  <text class="sub" x="590" y="164" text-anchor="middle">checks ownership</text>

  <!-- Sandbox -->
  <rect class="box" x="800" y="60" width="180" height="70" rx="10" fill="#f3eefc" stroke="#7a5cc0"/>
  <text class="title" x="890" y="92" text-anchor="middle">Sandbox</text>
  <text class="sub" x="890" y="112" text-anchor="middle">remote agent</text>

  <!-- Context Service -->
  <rect class="box" x="490" y="380" width="200" height="70" rx="10" fill="#eaf7ee" stroke="#3c8d5a"/>
  <text class="title" x="590" y="412" text-anchor="middle">Context Service</text>
  <text class="sub" x="590" y="432" text-anchor="middle">provisions and stores</text>

  <!-- PVC -->
  <path class="box" d="M800,392 v46 a90,12 0 0,0 180,0 v-46" fill="#eaf7ee" stroke="#3c8d5a"/>
  <ellipse class="box" cx="890" cy="392" rx="90" ry="12" fill="#eaf7ee" stroke="#3c8d5a"/>
  <text class="title" x="890" y="426" text-anchor="middle">PVC</text>
  <text class="sub" x="890" y="443" text-anchor="middle">context files</text>

  <!-- Helper -> MOCA -->
  <line class="line" x1="260" y1="80" x2="518" y2="80"/>
  <g class="step"><circle cx="280" cy="80" r="10"/><text x="280" y="80">2</text></g>
  <text class="api" x="298" y="74">POST /workloads</text>
  <text class="sub" x="298" y="96">create workload</text>

  <line class="line" x1="260" y1="126" x2="518" y2="126"/>
  <g class="step"><circle cx="280" cy="126" r="10"/><text x="280" y="126">3</text></g>
  <text class="api" x="298" y="120">POST /workloads/{id}/uploads</text>
  <text class="sub" x="298" y="142">request upload grant</text>

  <line class="line" x1="260" y1="172" x2="518" y2="172"/>
  <g class="step"><circle cx="280" cy="172" r="10"/><text x="280" y="172">5</text></g>
  <text class="api" x="298" y="166">POST /runs</text>
  <text class="sub" x="298" y="188">submit prompt</text>

  <line class="line" x1="260" y1="218" x2="518" y2="218"/>
  <g class="step"><circle cx="280" cy="218" r="10"/><text x="280" y="218">6</text></g>
  <text class="api" x="298" y="212">DELETE /workloads/{id}</text>
  <text class="sub" x="298" y="234">clean up</text>

  <!-- MOCA -> Sandbox -->
  <line class="line" x1="660" y1="95" x2="798" y2="95"/>
  <g class="step"><circle cx="680" cy="95" r="10"/><text x="680" y="95">5</text></g>
  <text class="sub" x="698" y="89" style="fill: #1f2937;">run agent</text>

  <!-- MOCA -> Context Service -->
  <line class="line" x1="590" y1="260" x2="590" y2="378"/>
  <g class="step"><circle cx="590" cy="288" r="10"/><text x="590" y="288">2</text></g>
  <text class="api" x="608" y="292">POST /v1/sandbox-pools</text>
  <text class="sub" x="608" y="308">create PVC + Sandbox</text>
  <g class="step"><circle cx="590" cy="336" r="10"/><text x="590" y="336">3</text></g>
  <text class="api" x="608" y="340">POST /v1/sandbox-pools/{id}/uploads</text>
  <text class="sub" x="608" y="356">issue one-time token</text>

  <!-- Helper -> Context Service (direct upload) -->
  <path class="line" d="M100,220 V415 H488"/>
  <g class="step"><circle cx="130" cy="415" r="10"/><text x="130" y="415">4</text></g>
  <text class="api" x="148" y="409">PUT /v1/sandbox-pools/{id}/uploads/{uid}</text>
  <text class="sub" x="148" y="431">bundle + one-time token</text>

  <!-- Context Service -> PVC -->
  <line class="line" x1="690" y1="415" x2="798" y2="415"/>
  <g class="step"><circle cx="712" cy="415" r="10"/><text x="712" y="415">4</text></g>
  <text class="sub" x="730" y="409" style="fill: #1f2937;">expand</text>

  <!-- Sandbox mounts PVC -->
  <line class="line" x1="890" y1="130" x2="890" y2="378" stroke-dasharray="5 4"/>
  <text class="sub" x="902" y="250" style="fill: #1f2937;">mounts</text>
  <text class="sub" x="902" y="266">read-only</text>
</svg>
