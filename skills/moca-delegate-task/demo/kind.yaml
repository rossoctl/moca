# Kind cluster for the moca-delegate-task demo (setup.sh creates it as moca-demo).
# Host ports bind to 127.0.0.1 only, and setup.sh turns the Services into these NodePorts:
#   127.0.0.1:8080 -> NodePort 30080 -> moca-supervisor (harness)
#   127.0.0.1:8090 -> NodePort 30082 -> moca-control-plane
#   127.0.0.1:8081 -> NodePort 30081 -> context-service (uploads)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Pinned so the host-access NetworkPolicy can exclude pod traffic.
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080, listenAddress: 127.0.0.1, protocol: TCP }
      - { containerPort: 30081, hostPort: 8081, listenAddress: 127.0.0.1, protocol: TCP }
      - { containerPort: 30082, hostPort: 8090, listenAddress: 127.0.0.1, protocol: TCP }
