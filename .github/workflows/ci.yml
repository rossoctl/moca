name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: valkey/valkey:9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store/v3
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - name: Cache pi-fork node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pi-fork/node_modules
          key: pi-fork-${{ hashFiles('pi-fork/package-lock.json') }}
          restore-keys: pi-fork-

      - name: Build pi-fork (type declarations)
        run: cd pi-fork && npm ci && npm run build

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # Same recursive run as `make typecheck`, so the two cannot drift apart by editing a
      # list in one of them. See the Makefile target for why that matters (#191).
      - name: Typecheck
        run: pnpm -r typecheck

      # @moca/sandbox-client's grep/find tests run the real ripgrep; under CI they fail, not skip,
      # without it.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Test
        run: pnpm -r test

      # p4-turn-smoke --auth mints with the control plane's real signer, which needs this job's
      # `pnpm install` (tsx). deploy-scripts has no node_modules, so it skips that block; here a
      # skip is a failure.
      - name: P4 turn driver, authenticated mode
        run: P4_SMOKE_REQUIRE_AUTH=1 bash deploy/microvm/tests/p4-turn-smoke.test.sh

      # research-smoke.test.sh, likewise, mints real tokens with packages/control-plane's tsx, which
      # deploy-scripts (no workspace install) does not have, so there it runs only its tsx-free
      # checks and skips the rest. Here the skip is a FAILURE (MOCA_REQUIRE_WORKSPACE=1), so the
      # mint-driven checks cannot stop running unseen. deploy/sbx's setup.test.sh does the same with
      # its signing-key round-trip (makeSigner, then the relay's sandbox-token verifier).
      - name: Deploy tests that need the workspace
        run: |
          MOCA_REQUIRE_WORKSPACE=1 bash deploy/vm/tests/research-smoke.test.sh
          MOCA_REQUIRE_WORKSPACE=1 bash deploy/sbx/tests/setup.test.sh

  # Runs the same `make lint` (pre-commit over all files) that contributors run locally, so
  # a config that silently executes zero hooks can no longer look identical to a green
  # build -- which is exactly how the broken `typescript` identify tag survived unnoticed.
  # Needs node/pnpm because the prettier hook drives the repo's own pinned Prettier, and
  # needs the pi-fork submodule because the workspace links into it.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install pre-commit
        run: pipx install pre-commit==4.3.0

      - name: Run hooks
        run: make lint

  # The deploy/ shell tests are cluster-free (kubectl/kind/docker are mocked on PATH), so
  # they need no node, no pnpm and no cluster -- hence their own fast job rather than a step
  # tacked onto `check`. Without this job nothing runs them: security-scans.yml only
  # shellchecks deploy/, and the live gate (RELAY_LIVE_SMOKE=1) cannot run in CI at all.
  deploy-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run deploy shell tests
        run: make test-deploy

      - name: Verify sandbox inventory against the image
        run: |
          jq --version
          IMAGE=ghcr.io/rossoctl/moca-remote-worker:latest
          docker pull "$IMAGE" || {
            echo "::warning title=Sandbox inventory drift check skipped::could not pull $IMAGE; inventory drift is UNVERIFIED"
            exit 0
          }
          bash scripts/verify-sandbox-inventory.sh "$IMAGE"

  # The same deploy/ suites, on bash 3.2 (#440). deploy-scripts above runs them on the runner's
  # bash 5; macOS ships 3.2.57 as /bin/bash, which is what an operator runs deploy/k8s/setup.sh
  # with. That version gap is not theoretical: slice 2 (#424) shipped `"${arr[@]}"` on an empty
  # array under `set -u`, which breaks every 3.2 run, and nothing in CI could see it -- it was
  # caught in review. This job is the thing that sees it.
  #
  # Three suites, not `make test-deploy`: four of the other suites use bash 4 constructs by
  # design. The list lives in the Makefile target, so it cannot drift from what contributors
  # reproduce locally with one command.
  deploy-scripts-bash32:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The target skips when /bin/bash is not 3.x, so without this check an Apple bump would
      # turn this job into a green no-op that reads as coverage. Fail loudly instead.
      - name: Confirm /bin/bash is 3.x
        run: |
          v="$(/bin/bash --version | head -1)"
          echo "$v"
          case "$v" in
          *"version 3."*) ;;
          *) echo "::error title=/bin/bash is no longer 3.x::$v -- this job no longer tests bash 3.2. The runner image changed or macOS shipped a newer bash; re-point the job, or drop it and say why on #440."; exit 1 ;;
          esac

      # deploy/microvm/tests/setup-microvm.test.sh guards its `shellcheck "$SCRIPT"` with
      # `command -v shellcheck`, so without this the check silently skips and asserts nothing.
      # jq is already on the runner image, and the suites pass against the stock LibreSSL at
      # /usr/bin/openssl, so neither of those needs installing.
      - name: Install shellcheck
        run: brew install shellcheck

      - name: Run the 3.2-safe deploy shell tests on /bin/bash
        run: make test-deploy-bash32

  # Spec §8's correctness gates for the microVM tier, and an explicit statement of the half
  # of them this runner cannot exercise. Six of them need /dev/kvm AND a golden snapshot
  # built by deploy/microvm/build-snapshot.sh -- a standard runner has neither, and the
  # snapshot cannot be cached because spec §2.4 requires restore on identical hardware. Those
  # run only from microvm-kvm-gates.yml on a rig.
  #
  # Before this job existed, `go test ./...` skipped all of them silently and the run looked
  # green, which reads as "the isolation gates pass". So this job runs the hardware-free ones
  # with -v (naming each), fails if NONE ran, and annotates every gate that did not run.
  # remote-worker/internal/vmpool/gates_inventory_test.go is the drift check on that split and
  # fails if this job or the manual workflow stops existing.
  microvm-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: remote-worker/go.mod

      - name: Run the gates that need no hypervisor
        working-directory: remote-worker
        run: |
          set -u
          log="$RUNNER_TEMP/gates.log"
          rc=0
          go test -race -v \
            -run 'TestGate|TestTheGateInventoryMatchesTheCode|TestTheCIWorkflowsRunTheGates|TestTheSnapshotCredentialScannerFiresOnEveryPattern' \
            ./internal/vmpool/ > "$log" 2>&1 || rc=$?
          passed=$(grep -E '^--- PASS: ' "$log" | awk '{print $3}' | sort -u || true)
          skipped=$(grep -E '^--- SKIP: ' "$log" | awk '{print $3}' | sort -u || true)
          {
            echo '### microVM spec §8 gates'
            echo
            printf 'Ran here:\n```\n%s\n```\n' "${passed:-(none)}"
            printf 'NOT run here (need /dev/kvm + a golden snapshot; see microvm-kvm-gates.yml):\n```\n%s\n```\n' "${skipped:-(none)}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$skipped" ]; then
            n=$(echo "$skipped" | wc -l | tr -d ' ')
            echo "::warning title=$n microVM gates did NOT run::they need /dev/kvm and a golden snapshot, which this runner does not have; a green run here is NOT evidence for them. Run .github/workflows/microvm-kvm-gates.yml on the rig."
          fi
          if [ -z "$passed" ]; then
            echo "::error title=No gate ran::this job asserted nothing"
            rc=1
          fi
          cat "$log"
          exit $rc

      - name: Run the guest agent's lease tests as root (cgroup v2, uid drop, seccomp)
        working-directory: remote-worker
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" GOCACHE="$RUNNER_TEMP/gocache-root" go test -race -v -run 'TestShim|TestSeccomp|TestLease|TestNormalise' ./internal/guestagent/ 2>&1 | tee "$RUNNER_TEMP/lease.log"
          grep -q '^--- PASS: TestShimDropsToTheExecUserWithNoPrivileges' "$RUNNER_TEMP/lease.log" || { echo '::error title=Lease root tests asserted nothing::'; exit 1; }

      # -race needs cgo, and under cgo glibc's setxid broadcast does the shim's
      # setgroups/setres[ug]id. The guest-agent binary is built CGO_ENABLED=0, where Go's
      # own AllThreadsSyscall does them: this run covers that production path.
      - name: Run the lease shim tests as root without cgo (the production setxid path)
        working-directory: remote-worker
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" CGO_ENABLED=0 GOCACHE="$RUNNER_TEMP/gocache-root-nocgo" go test -v -run 'TestShim' ./internal/guestagent/ 2>&1 | tee "$RUNNER_TEMP/shim-nocgo.log"
          grep -q '^--- PASS: TestShimDropsToTheExecUserWithNoPrivileges' "$RUNNER_TEMP/shim-nocgo.log" || { echo '::error title=Lease shim tests without cgo asserted nothing::'; exit 1; }

  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: '1.71.0'
          github_token: ${{ github.token }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work

      - name: Lint proto
        run: buf lint

      - name: Regenerate stubs
        run: buf generate

      - name: Verify no codegen drift
        run: |
          git add -A -- packages/k8s-sandbox/src/gen packages/sandbox-client/src/gen gen
          git diff --cached --exit-code -- packages/k8s-sandbox/src/gen packages/sandbox-client/src/gen gen \
            || { echo "::error::Generated stubs are out of date or untracked. Run 'buf generate' and commit."; exit 1; }

      # A module left out of go.work falls back to standalone resolution and brings
      # back the stale-go.mod failure the workspace exists to prevent (#212).
      - name: Verify go.work covers every module
        run: |
          covered="$(go work edit -json | jq -r '.Use[].DiskPath')"
          rc=0
          while read -r mod; do
            dir="./$(dirname "$mod")"
            grep -qxF "$dir" <<<"$covered" \
              || { echo "::error file=$mod::$mod is not listed in go.work -- add \"$dir\" to the use block."; rc=1; }
          done < <(git ls-files | grep -E '(^|/)go\.mod$')
          exit $rc

      - name: Build and test Go stubs
        run: cd gen/go && go build ./... && go test ./...

      - name: Build and test remote-worker
        working-directory: remote-worker
        run: |
          test -z "$(gofmt -l .)" || { echo "::error::gofmt needs running:"; gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

      # Advisory only. In workspace mode a stale go.mod no longer breaks the build, so
      # this is hygiene rather than correctness -- and failing here would put Dependabot's
      # coupled bumps back in the red, which is the whole point of #212. Neither module is
      # consumed externally (gen/go is reached only through the local replace), so drift
      # can be tidied whenever convenient.
      - name: Check go.mod tidiness (advisory)
        run: |
          for mod in gen/go remote-worker; do
            (cd "$mod" && go mod tidy -diff) \
              || echo "::warning file=$mod/go.mod::$mod/go.mod is not tidy -- run 'cd $mod && go mod tidy'"
          done

  # Offline check of relative Markdown links and in-repo anchors (`make check-links`), and the
  # sandbox/v1 Python examples' tests. No submodules; the link check is stdlib Python over
  # `git ls-files`, and only the examples' step installs anything (grpcio, into a venv).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Markdown links
        run: python3 scripts/check-doc-links.py

      # The sandbox/v1 direct-client examples' offline tests (docs/api/sandbox-v1-direct-client.md):
      # no network beyond pip, no relay. The runner's own python3, so no unpinned setup action;
      # grpcio pinned to the versions the tests were written against.
      - name: Test the sandbox/v1 Python examples
        working-directory: docs/api/examples
        run: |
          python3 -m venv /tmp/sbxpy
          /tmp/sbxpy/bin/pip install -q grpcio==1.84.0 grpcio-tools==1.84.0
          /tmp/sbxpy/bin/python -m grpc_tools.protoc -I ../../../proto \
            --python_out=. --grpc_python_out=. sandbox/v1/sandbox.proto
          /tmp/sbxpy/bin/python -m unittest test_sandbox_v1_client
