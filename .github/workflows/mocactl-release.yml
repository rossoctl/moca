name: mocactl release asset

# Builds mocactl.mjs, the single-file bundle scripts/install-mocactl.sh installs, and attaches it with
# its SHA-256 to each published release and to the rolling `mocactl-edge` prerelease on every push to
# main (docs/specs/2026-10-08-mocactl-installer-design.md §5).

on:
  release:
    types: [published]
  push:
    branches: [main]

# Read-only by default: only `publish`, which never installs or runs a dependency, may write.
permissions:
  contents: read

concurrency:
  group: mocactl-release-${{ github.ref }}
  # An older main build must never overwrite a newer one; a release upload is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Installs, builds and tests with a read-only token, and no token left in .git/config: a dependency's
  # install script or test-time code can at worst tamper with this job's own output, never push a tag
  # or edit a release.
  build:
    # The edge prerelease is (re)created by this workflow; publishing it must not start another run.
    if: github.event_name == 'push' || github.event.release.tag_name != 'mocactl-edge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      # mocactl and its workspace dependencies only: nothing here needs pi-fork.
      - name: Install
        run: pnpm install --frozen-lockfile --filter '@moca/mocactl...'

      - name: Version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = release ]; then v="$TAG"; else v="edge-${GITHUB_SHA::7}"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - name: Build
        env:
          MOCACTL_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm --filter @moca/mocactl build

      # Same checks as `make test`, against this build's own bundle: headless, under a pty, clipboard.
      - name: Test the bundle
        run: pnpm --filter @moca/mocactl exec vitest run test/bundle.test.ts

      - name: Smoke the asset outside the workspace
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/mocactl-asset"
          mkdir -p "$dir"
          cp packages/mocactl/dist/mocactl.mjs "$dir/"
          cd "$dir"
          got="$(env -u NODE_PATH node mocactl.mjs --version)"
          [ "$got" = "$VERSION" ] || { echo "bundle says '$got', expected '$VERSION'" >&2; exit 1; }
          env -u NODE_PATH node mocactl.mjs --help >/dev/null
          sha256sum mocactl.mjs >mocactl.mjs.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mocactl-asset
          path: ${{ runner.temp }}/mocactl-asset/
          if-no-files-found: error
          retention-days: 7

  # Holds the write token and runs nothing but gh: no checkout, no pnpm, no repository code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mocactl-asset
          path: asset

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" asset/mocactl.mjs asset/mocactl.mjs.sha256 --clobber

      # The tag moves to this commit through the API (there is no checkout to push from); the prerelease
      # is created once and its assets replaced after. While they are replaced an installer can briefly
      # see no asset, or a new bundle with the old checksum: it then refuses, installs nothing, and says
      # to re-run.
      - name: Publish mocactl-edge
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # git/ref (singular) is an exact lookup; git/refs/<prefix> also succeeds on prefix matches.
          if gh api "repos/$GH_REPO/git/ref/tags/mocactl-edge" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/mocactl-edge" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/mocactl-edge -f sha="$GITHUB_SHA" >/dev/null
          fi
          notes="mocactl built from main at $GITHUB_SHA ($VERSION), rebuilt on every push. Install it with:

          curl -fsSL https://raw.githubusercontent.com/rossoctl/moca/main/scripts/install-mocactl.sh | MOCACTL_VERSION=edge sh"
          if gh release view mocactl-edge >/dev/null 2>&1; then
            gh release edit mocactl-edge --prerelease --latest=false --notes "$notes"
          else
            gh release create mocactl-edge --prerelease --latest=false --verify-tag \
              --title 'mocactl edge (main)' --notes "$notes"
          fi
          gh release upload mocactl-edge asset/mocactl.mjs asset/mocactl.mjs.sha256 --clobber
