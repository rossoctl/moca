name: Build and Push Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Main harness image.
          - image: ghcr.io/rossoctl/moca
            context: .
            file: Dockerfile
          # Pre-baked sandbox image for OpenShift (deploy/knative/setup-ocp.sh).
          # Built the same way as the harness so OCP can pull it from GHCR instead
          # of building it in-cluster (issue #41). Scoped context — sandbox.Dockerfile
          # has no COPY, so deploy/knative keeps the build context small.
          - image: ghcr.io/rossoctl/moca-sandbox
            context: deploy/knative
            file: deploy/knative/sandbox.Dockerfile
          # RC1-2 (Hop 2) plain-HTTP echo target for the AuthBridge egress smoke.
          # Published so OpenShift (deploy/knative/setup-ocp.sh, RC1-4) can pull it
          # from GHCR instead of a local dev.local build; the OCP overlay remaps
          # dev.local/echo-target:rc1 -> this image. Context is echo-target/ because
          # its Dockerfile COPYs echo.js.
          - image: ghcr.io/rossoctl/moca-echo-target
            context: deploy/knative/echo-target
            file: deploy/knative/echo-target/Dockerfile
          # The remote-worker sandbox for the dev-machine compose trial (deploy/compose, #342): it
          # dials OUT to the relay, unlike the sleep-infinity sandbox image above. Published so a
          # `curl | sh` install has something to pull; context is the repo root because its
          # Dockerfile COPYs go.work and gen/go alongside remote-worker/.
          - image: ghcr.io/rossoctl/moca-remote-worker
            context: .
            file: remote-worker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ matrix.image }}
          tags: |
            # priority 300: metadata-action's version output follows the highest-priority tag, and
            # type=raw 'latest' (200) would otherwise outrank the sha tag (100) on main pushes.
            type=sha,prefix=main-,enable={{is_default_branch}},priority=300
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The version the harness/control plane advertise (MOCA_VERSION; the root Dockerfile is
          # the only one that consumes it — the other matrix images ignore the unused build-arg).
          build-args: MOCA_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
